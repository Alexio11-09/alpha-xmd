name: Update Activity Graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-graph.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      - name: Download activity graph SVG
        run: |
          curl -L -o profile/activity-graph.svg "https://github-readme-activity-graph.vercel.app/graph?username=Alexio11-09&theme=react-dark&hide_border=true&area=true"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity-graph.svg
          git diff --staged --quiet || git commit -m "Update activity graph"
          git push