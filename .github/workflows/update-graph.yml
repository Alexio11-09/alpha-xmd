name: Update Activity Graph

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allows you to run it manually from the Actions tab
  workflow_dispatch:

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Activity Graph
        uses: Ashutosh00710/github-readme-activity-graph@v1
        with:
          # Your GitHub username
          username: Alexio11-09
          # Theme for the graph
          theme: react-dark
          # Where to save the file in your repo
          output_path: 'profile/activity-graph.svg'
          # The GitHub token is automatically provided
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push the generated graph
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/activity-graph.svg
          git commit -m "Update activity graph" || exit 0
          git push